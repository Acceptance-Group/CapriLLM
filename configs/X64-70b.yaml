model:
  vocab_size: 64000
  d_model: 8192
  num_layers: 80
  num_heads: 64
  num_kv_heads: 8
  max_seq_len: 8192
  intermediate_size: 28672
  norm_eps: 1.0e-5
  rope_theta: 500000.0
  tie_embeddings: false
  attention_backend: flash_attention_2

train:
  dataset_name: "your-large-instruct-dataset"
  format_template: "<system|>\nYou are a helpful assistant.\n<end|>\n<user|>\n{instruction}\n{input}\n<end|>\n<assistant|>\n{output}\n<end|>"
  tokenizer_path: "tokenizer_64k.json"
  output_dir: "outputs/x64_70b"
  batch_size: 1
  gradient_accumulation_steps: 128
  num_epochs: 1
  max_steps: 100000
  learning_rate: 1.0e-4
  weight_decay: 0.1
  warmup_steps: 2000
  max_grad_norm: 1.0
  precision: bf16
  distributed_strategy: fsdp
  gradient_checkpointing: true
  eval_interval: 500
  save_interval: 2000
  seed: 42
  num_workers: 8
  num_threads: 8
