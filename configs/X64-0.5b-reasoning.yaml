model:
  vocab_size: 32000
  d_model: 1280
  num_layers: 24
  num_heads: 20
  num_kv_heads: 4
  max_seq_len: 8192
  intermediate_size: 3584
  norm_eps: 1.0e-5
  rope_theta: 10000.0
  tie_embeddings: true
  attention_backend: flash_attention_2

train:
  dataset_name: "simplescaling/s1K-1.1"
  format_template: "<system|>\nYou are a helpful assistant. Think step by step.\n<end|>\n<user|>\n{question}\n<end|>\n<assistant|>\n<think|>\n{deepseek_thinking_trajectory}\n</think|>\n{deepseek_attempt}\n<end|>"
  tokenizer_path: "tokenizer.json"
  output_dir: "outputs/x64_0.5b_reasoning"
  batch_size: 1
  gradient_accumulation_steps: 16
  num_epochs: 8
  max_steps: 8000
  learning_rate: 2.0e-4
  weight_decay: 0.1
  warmup_steps: 200
  max_grad_norm: 1.0
  precision: bf16
  distributed_strategy: single_gpu
  gradient_checkpointing: true
  eval_interval: 200
  save_interval: 2000
  seed: 42
  num_workers: 4
  num_threads: 8
