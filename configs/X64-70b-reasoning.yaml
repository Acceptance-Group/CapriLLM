model:
  vocab_size: 64000
  d_model: 8192
  num_layers: 80
  num_heads: 64
  num_kv_heads: 8
  max_seq_len: 16384
  intermediate_size: 28672
  norm_eps: 1.0e-5
  rope_theta: 500000.0
  tie_embeddings: false
  attention_backend: flash_attention_2

train:
  dataset_name: "simplescaling/s1K-1.1"
  format_template: "<system|>\nYou are a helpful assistant. Think step by step.\n<end|>\n<user|>\n{question}\n<end|>\n<assistant|>\n<think|>\n{deepseek_thinking_trajectory}\n</think|>\n{deepseek_attempt}\n<end|>"
  tokenizer_path: "tokenizer_64k.json"
  output_dir: "outputs/x64_70b_reasoning"
  batch_size: 1
  gradient_accumulation_steps: 128
  num_epochs: 8
  max_steps: 8000
  learning_rate: 5.0e-5
  weight_decay: 0.1
  warmup_steps: 200
  max_grad_norm: 1.0
  precision: bf16
  distributed_strategy: fsdp
  gradient_checkpointing: true
  eval_interval: 500
  save_interval: 2000
  seed: 42
  num_workers: 8
  num_threads: 8
