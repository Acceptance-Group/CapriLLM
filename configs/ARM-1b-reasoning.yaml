model:
  vocab_size: 8000
  d_model: 2048
  num_layers: 22
  num_heads: 16
  num_kv_heads: 4
  max_seq_len: 1024
  intermediate_size: 5504
  norm_eps: 1.0e-5
  rope_theta: 10000.0
  tie_embeddings: true
  attention_backend: eager

train:
  dataset_name: "simplescaling/s1K-1.1"
  format_template: "<system|>\nYou are a helpful assistant. Think step by step.\n<end|>\n<user|>\n{question}\n<end|>\n<assistant|>\n<think|>\n{deepseek_thinking_trajectory}\n</think|>\n{deepseek_attempt}\n<end|>"
  tokenizer_path: "tokenizer.json"
  output_dir: "outputs/arm_1b_reasoning"
  batch_size: 1
  gradient_accumulation_steps: 16
  num_epochs: 4
  max_steps: 4000
  learning_rate: 2.0e-4
  weight_decay: 0.1
  warmup_steps: 100
  max_grad_norm: 1.0
  precision: fp32
  distributed_strategy: single_gpu
  gradient_checkpointing: true
  eval_interval: 100
  save_interval: 1000
  seed: 42
  num_workers: 0
  num_threads: 4
