model:
  vocab_size: 32000
  d_model: 1024
  num_layers: 20
  num_heads: 16
  num_kv_heads: 4
  max_seq_len: 4096
  intermediate_size: 2816
  norm_eps: 1.0e-5
  rope_theta: 10000.0
  tie_embeddings: true
  attention_backend: eager

train:
  data_path: "data/reasoning_en.jsonl"
  format_template: null
  init_from: "outputs/x64_025b_sft/checkpoint_final.pt"
  tokenizer_path: "tokenizer.json"
  output_dir: "outputs/x64_025b_reasoning"
  batch_size: 1
  gradient_accumulation_steps: 4
  num_epochs: 3
  max_steps: 3000
  learning_rate: 1.0e-4
  weight_decay: 0.1
  warmup_steps: 50
  max_grad_norm: 1.0
  precision: bf16
  distributed_strategy: single_gpu
  gradient_checkpointing: true
  eval_interval: 250
  save_interval: 1000
  seed: 42
  num_workers: 0
  num_threads: 8
