model:
  vocab_size: 32000
  d_model: 1024
  num_layers: 20
  num_heads: 16
  num_kv_heads: 4
  max_seq_len: 1024
  intermediate_size: 2816
  norm_eps: 1.0e-5
  rope_theta: 10000.0
  tie_embeddings: true
  attention_backend: eager

train:
  data_path: "data/pretrain_ru_en.jsonl"
  format_template: null
  tokenizer_path: "tokenizer.json"
  output_dir: "outputs/x64_025b_pretrain"
  batch_size: 1
  gradient_accumulation_steps: 8
  num_epochs: 1
  max_steps: 60000
  learning_rate: 4.0e-4
  weight_decay: 0.1
  warmup_steps: 200
  max_grad_norm: 1.0
  precision: bf16
  distributed_strategy: single_gpu
  gradient_checkpointing: true
  eval_interval: 500
  save_interval: 10000
  seed: 42
  num_workers: 0
  num_threads: 8
